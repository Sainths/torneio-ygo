<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Torneio - Painel</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #150929 0%, #2c1a13 100%); color: #f0e6d2; margin: 0; padding: 15px; text-align: center; }
        nav { display: flex; justify-content: space-around; background: rgba(44, 26, 19, 0.9); padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #5a3d28; }
        nav button { background: none; border: none; color: #aaa; font-size: 15px; cursor: pointer; font-weight: bold; }
        nav button.ativo { color: #ffcc00; border-bottom: 2px solid #ffcc00; text-shadow: 0 0 5px #ffcc00; }
        .aba { display: none; padding: 10px; }
        .aba.ativa { display: block; }
        .podio-container { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin: 20px auto; max-width: 450px; }
        .podio-lugar { background: rgba(44, 26, 19, 0.85); border: 2px solid #5a3d28; border-radius: 8px; padding: 12px; text-align: center; flex: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .top1 { order: 2; border: 3px solid #ffcc00; box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); transform: scale(1.08); background: linear-gradient(180deg, #2b114c 0%, #2c1a13 100%); }
        .top2 { order: 1; border: 2px solid #cccccc; }
        .top3 { order: 3; border: 2px solid #cd7f32; }
        .podio-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #ffcc00; object-fit: cover; background: #333; }
        .top1 .podio-avatar { width: 70px; height: 70px; }
        .titulo-rei { background: #ffcc00; color: #150929; font-weight: bold; font-size: 10px; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; display: inline-block; margin-bottom: 4px; }
        .tabela-container { width: 100%; overflow-x: auto; border: 1px solid #5a3d28; border-radius: 8px; background-color: rgba(31, 20, 40, 0.9); max-width: 550px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #3d251c; font-size: 14px; }
        th { background-color: #1a0b36; color: #ffcc00; }
        .avatar-tabela { width: 30px; height: 30px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }
        .card-box { background: rgba(44, 26, 19, 0.9); border: 2px solid #5a3d28; padding: 20px; border-radius: 8px; max-width: 450px; margin: 15px auto; }
        input, select { width: 90%; padding: 10px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #5a3d28; background: #150929; color: white; }
        .btn-salvar { background-color: #ffcc00; color: #150929; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 95%; }
        .card-duelista { background-color: #1f1f1f; border: 1px solid #333; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .btn-desafiar { background-color: #ff3333; color: white; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <button id="btnClassificacao" class="ativo" onclick="mudarAba('classificacao')">🏆 Ranking</button>
        <button id="btnArena" onclick="mudarAba('arena')">⚔️ Arena</button>
        <button id="btnPerfil" onclick="mudarAba('perfil')">👤 Perfil</button>
    </nav>
    <div id="abaClassificacao" class="aba ativa">
        <h2>RANKING DOS DUELISTAS</h2>
        <div class="podio-container" id="podio"></div>
        <div class="tabela-container">
            <table>
                <thead><tr><th>Pos</th><th style="text-align:left;">Duelista</th><th>Deck</th><th style="color:#ffcc00;">🌟 Estrelas</th></tr></thead>
                <tbody id="restoRanking"></tbody>
            </table>
        </div>
    </div>
    <div id="abaArena" class="aba">
        <h2>⚔️ ARENA DE DUELOS</h2>
        <div class="card-box">
            <h3>Desafiar um Jogador</h3>
            <select id="selectOponente"><option value="">Selecione o Oponente...</option></select>
            <select id="tipoDuelo" onchange="document.getElementById('campoAposta').style.display = (this.value === 'aposta') ? 'block' : 'none';">
                <option value="normal">Duelo Normal</option>
                <option value="aposta">Apostar Estrelas 🌟</option>
            </select>
            <div id="campoAposta" style="display: none;"><input type="number" id="qtdAposta" value="1" min="1"></div>
            <button class="btn-salvar" onclick="enviarDesafio()">Chamar para o Duelo!</button>
        </div>
        <div class="card-box"><h3>Duelistas Ativos</h3><div id="listaArena"></div></div>
    </div>
    <div id="abaPerfil" class="aba">
        <h2>👤 MEU PERFIL</h2>
        <div class="card-box">
            <img id="perfilAvatar" style="width:75px; height:75px; border-radius:50%; border:2px solid #ffcc00;" src="yugi.jpg"><br><br>
            <label>Nome:</label><br><input type="text" id="perfilNome"><br>
            <label>Deck:</label><br><input type="text" id="perfilDeck"><br>
            <button class="btn-salvar" onclick="salvarPerfil()">Salvar Alterações</button>
        </div>
    </div>
    <!-- PARTE 2: MOTOR LÓGICO E CONEXÃO COMPLETA -->
    <script>
        // Função para carregar o Supabase de forma garantida na sua máquina
        function iniciarApp() {
            if (typeof window.supabase === 'undefined') {
                // Tenta carregar por uma rota de contingência se a principal falhar
                var script = document.createElement('script');
                script.src = "https://unpkg.com";
                script.onload = () => { configurarConexao(); };
                document.head.appendChild(script);
            } else {
                configurarConexao();
            }
        }

        function configurarConexao() {
            const SUPABASE_URL = "https://supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnc3ptbWxyaWZhZHphb3ZzdXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ4ODQsImV4cCI6MjEwNzczMDg4NH0.8zErqM1amU0GFPsylPA2E6_GvKJhbTOEcjGdzJNMQIE";
            window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            carregarRanking();
        }

        const meuIdLogado = localStorage.getItem('id_usuario_logado');
        let minhasEstrelas = 2;

        function mudarAba(nomeAba) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('ativo'));
            if(nomeAba === 'classificacao') { document.getElementById('abaClassificacao').classList.add('ativa'); document.getElementById('btnClassificacao').classList.add('ativo'); carregarRanking(); }
            if(nomeAba === 'arena') { document.getElementById('abaArena').classList.add('ativa'); document.getElementById('btnArena').classList.add('ativo'); carregarArena(); }
            if(nomeAba === 'perfil') { document.getElementById('abaPerfil').classList.add('ativa'); document.getElementById('btnPerfil').classList.add('ativo'); carregarPerfil(); }
        }

        async function carregarRanking() {
            if(!window.supabaseClient) return;
            const { data } = await window.supabaseClient.from('usuarios').select('*').order('estrelas', { ascending: false });
            if (!data) return;
            const podio = document.getElementById('podio'); const resto = document.getElementById('restoRanking');
            podio.innerHTML = ""; resto.innerHTML = "";
            
            data.forEach((j, idx) => {
                const pos = idx + 1; const av = j.avatar_id + ".jpg"; 
                if(j.id === meuIdLogado) minhasEstrelas = j.estrelas || 2;
                
                if(pos === 1) podio.innerHTML += `<div class="podio-lugar top1"><span class="titulo-rei">👑 Rei dos Jogos</span><br><img class="podio-avatar" src="${av}"><h4>${j.nome}</h4><small>${j.deck_nome}</small><div style="color:#ffcc00; font-weight:bold; margin-top:4px;">🌟 ${j.estrelas}</div></div>`;
                else if(pos === 2) podio.innerHTML += `<div class="podio-lugar top2"><span>2º Lugar</span><br><img class="podio-avatar" src="${av}"><h5>${j.nome}</h5><div style="color:#ffcc00; font-weight:bold; margin-top:4px;">🌟 ${j.estrelas}</div></div>`;
                else if(pos === 3) podio.innerHTML += `<div class="podio-lugar top3"><span>3º Lugar</span><br><img class="podio-avatar" src="${av}"><h5>${j.nome}</h5><div style="color:#ffcc00; font-weight:bold; margin-top:4px;">🌟 ${j.estrelas}</div></div>`;
                else resto.innerHTML += `<tr><td>${pos}º</td><td style="text-align:left;"><b>${j.nome}</b></td><td>${j.deck_nome}</td><td style="color:#ffcc00; font-weight:bold;">${j.estrelas}</td></tr>`;
            });
        }

        async function carregarPerfil() {
            if(!window.supabaseClient) return;
            const { data } = await window.supabaseClient.from('usuarios').select('*').eq('id', meuIdLogado).single();
            if(data) { document.getElementById('perfilNome').value = data.nome; document.getElementById('perfilDeck').value = data.deck_nome; document.getElementById('perfilAvatar').src = data.avatar_id + ".jpg"; }
        }

        async function salvarPerfil() {
            if(!window.supabaseClient) return;
            const n = document.getElementById('perfilNome').value; const d = document.getElementById('perfilDeck').value;
            await window.supabaseClient.from('usuarios').update({ nome: n, deck_nome: d }).eq('id', meuIdLogado); alert("Perfil atualizado!");
        }

        async function carregarArena() {
            if(!window.supabaseClient) return;
            const { data } = await window.supabaseClient.from('usuarios').select('*').order('nome', { ascending: true });
            if(!data) return;
            const ops = data.filter(j => j.id !== meuIdLogado);
            const select = document.getElementById('selectOponente'); const lista = document.getElementById('listaArena');
            select.innerHTML = '<option value="">Selecione o Oponente...</option>'; lista.innerHTML = "";
            ops.forEach(o => {
                select.innerHTML += `<option value="${o.id}">${o.nome}</option>`;
                lista.innerHTML += `<div class="card-duelista"><div><b>${o.nome}</b><br><small style="color:#aaa;">🃏 ${o.deck_nome} | 🌟 ${o.estrelas}</small></div><button class="btn-desafiar" onclick="document.getElementById('selectOponente').value='${o.id}'">Escolher</button></div>`;
            });
        }

        async function enviarDesafio() {
            if(!window.supabaseClient) return;
            const opId = document.getElementById('selectOponente').value; const tipo = document.getElementById('tipoDuelo').value;
            let aposta = 0; if(!opId) return alert("Selecione um oponente!");
            if(tipo === 'aposta') {
                aposta = parseInt(document.getElementById('qtdAposta').value);
                if(aposta > minhasEstrelas) return alert("Você não pode apostar mais estrelas!");
            }
            await window.supabaseClient.from('desafios').insert([{ desafiante_id: meuIdLogado, desafiado_id: opId, tipo: tipo, estrelas_apostadas: aposta, status: 'pendente' }]);
            alert("Desafio enviado!");
        }

        window.onload = () => { iniciarApp(); };
    </script>
</body>
</html>
