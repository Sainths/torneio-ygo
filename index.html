<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Torneio - Login</title>
    <!-- Link direto unificado via CDN oficial estável -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #150929 0%, #2c1a13 100%); color: #f0e6d2; text-align: center; margin: 0; padding: 20px; }
        .container { background: rgba(44, 26, 19, 0.9); border: 2px solid #5a3d28; box-shadow: 0 0 20px rgba(0,0,0,0.7); max-width: 400px; margin: 40px auto; padding: 25px; border-radius: 8px; }
        h2 { color: #ffcc00; text-shadow: 0 0 8px rgba(255,204,0,0.4); margin-bottom: 25px; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #5a3d28; background: #150929; color: white; font-size: 14px; }
        button { width: 96%; padding: 12px; background: #ffcc00; color: #150929; font-weight: bold; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
        .alternar-link { color: #ffcc00; cursor: pointer; display: inline-block; margin-top: 15px; font-size: 14px; text-decoration: underline; }
        .avatar-box { display: flex; justify-content: center; gap: 12px; margin: 15px 0; flex-wrap: wrap; }
        .avatar-box label { cursor: pointer; text-align: center; }
        .avatar-box img { width: 55px; height: 55px; border-radius: 50%; border: 3px solid transparent; object-fit: cover; }
        .avatar-box input:checked + img { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .avatar-txt { display: block; font-size: 11px; margin-top: 2px; color: #aaa; }
    </style>
</head>
<body>

    <div class="container" id="painelAutenticacao">
        <!-- SUA LOGO DO TORNEIO LOCAL -->
        <img src="logo.png" alt="Logo Torneio" style="width: 140px; height: auto; margin: 0 auto 20px auto; display: block;">
        
        <h2 id="tituloTela">ENTRAR NO TORNEIO</h2>
        
        <form id="meuFormulario">
            <div id="camposCadastro" style="display: none;">
                <input type="text" id="nome" placeholder="Nome do Duelista"><br>
                <input type="text" id="deck" placeholder="Nome do seu Deck Principal"><br>
                <p style="margin: 5px 0; font-size: 13px; color: #ffcc00;">Escolha seu Ícone Inicial (+2 🌟 de Bônus!):</p>
                
                <!-- SUA LISTA ATUALIZADA COM OS 7 PERSONAGENS LOCAIS -->
                <div class="avatar-box">
                    <label>
                        <input type="radio" name="avatar" value="yugi" checked style="display:none;">
                        <img src="yugi.jpg" alt="Yugi"><span class="avatar-txt">Yugi</span>
                    </label>
                    <label>
                        <input type="radio" name="avatar" value="farao" style="display:none;">
                        <img src="farao.jpg" alt="Faraó"><span class="avatar-txt">Faraó</span>
                    </label>
                    <label>
                        <input type="radio" name="avatar" value="jaden" style="display:none;">
                        <img src="jaden.jpg" alt="Jaden"><span class="avatar-txt">Jaden</span>
                    </label>
                    <label>
                        <input type="radio" name="avatar" value="zane" style="display:none;">
                        <img src="zane.jpg" alt="Zane"><span class="avatar-txt">Zane</span>
                    </label>
                    <label>
                        <input type="radio" name="avatar" value="kaiba" style="display:none;">
                        <img src="kaiba.jpg" alt="Kaiba"><span class="avatar-txt">Kaiba</span>
                    </label>
                    <label>
                        <input type="radio" name="avatar" value="joey" style="display:none;">
                        <img src="joey.jpg" alt="Joey"><span class="avatar-txt">Joey</span>
                    </label>
                    <label>
                        <input type="radio" name="avatar" value="pegasus" style="display:none;">
                        <img src="pegasus.jpg" alt="Pegasus"><span class="avatar-txt">Pegasus</span>
                    </label>
                </div>
            </div>

            <input type="email" id="email" placeholder="E-mail (Seu Login)" required><br>
            <input type="password" id="senha" placeholder="Senha" required><br>
            
            <button type="submit" id="btnAcao">Duelo!</button>
        </form>

        <span class="alternar-link" id="btnAlternar" onclick="alternarModo()">Não tem cadastro? Registrar Duelista</span>
    </div>

    <script>
        let modoCadastro = false;

        function alternarModo() {
            modoCadastro = !modoCadastro;
            if (modoCadastro) {
                document.getElementById('tituloTela').innerText = "REGISTRAR DUELISTA";
                document.getElementById('camposCadastro').style.display = "block";
                document.getElementById('btnAcao').innerText = "Criar Conta e Ganhar Estrelas";
                document.getElementById('btnAlternar').innerText = "Já tem conta? Fazer Login";
            } else {
                document.getElementById('tituloTela').innerText = "ENTRAR NO TORNEIO";
                document.getElementById('camposCadastro').style.display = "none";
                document.getElementById('btnAcao').innerText = "Duelo!";
                document.getElementById('btnAlternar').innerText = "Não tem cadastro? Registrar Duelista";
            }
        }

        window.addEventListener('load', () => {
            const SUPABASE_URL = "https://supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnc3ptbWxyaWZhZHphb3ZzdXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ4ODQsImV4cCI6MjEwNzczMDg4NH0.8zErqM1amU0GFPsylPA2E6_GvKJhbTOEcjGdzJNMQIE";
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            document.getElementById('meuFormulario').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;

                if (modoCadastro) {
                    const nome = document.getElementById('nome').value;
                    const deck = document.getElementById('deck').value;
                    const avatar = document.querySelector('input[name="avatar"]:checked').value;

                    const { data: authData, error: authError } = await supabase.auth.signUp({ email, password: senha });
                    if (authError) return alert("Erro no registro: " + authError.message);

                    if (authData.user) {
                        const { error: dbError } = await supabase.from('usuarios').insert([
                            { id: authData.user.id, nome: nome, deck_nome: deck, avatar_id: avatar, estrelas: 2 }
                        ]);
                        if (dbError) return alert("Erro no banco: " + dbError.message);
                        
                        alert("Duelista cadastrado com sucesso com +2 Estrelas!");
                        localStorage.setItem('id_usuario_logado', authData.user.id);
                        window.location.href = "mainpage.html";
                    }
                } else {
                    const { data: logData, error: logError } = await supabase.auth.signInWithPassword({ email, password: senha });
                    if (logError) return alert("Erro de Login: " + logError.message);
                    
                    if (logData.user) {
                        localStorage.setItem('id_usuario_logado', logData.user.id);
                        window.location.href = "mainpage.html";
                    }
                }
            });
        });
    </script>
</body>
</html>
