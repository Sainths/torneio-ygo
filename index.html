<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>YGO Tournament Manager</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; box-sizing: border-box; }
    .container { width: 100%; max-width: 450px; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #2a2a2a; align-self: flex-start; }
    h2, h3 { text-align: center; color: #ff8c00; margin-top: 0; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #b3b3b3; font-size: 13px; }
    input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 15px; }
    input:focus { border-color: #ff8c00; outline: none; }
    button { width: 100%; padding: 11px; background: #ff8c00; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:hover { background: #e07b00; }
    .toggle-link { text-align: center; margin-top: 12px; color: #ff8c00; cursor: pointer; font-size: 13px; }
    .hidden { display: none !important; }
    
    /* ABAS DE NAVEGAÇÃO */
    .tabs { display: flex; margin-bottom: 15px; background: #252525; border-radius: 6px; padding: 3px; }
    .tab-btn { flex: 1; padding: 8px; text-align: center; background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 4px; }
    .tab-btn.active { background: #ff8c00; color: #fff; }

    /* CENTRAL DO DUELISTA */
    .profile-card { text-align: center; background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
    .stars { color: #ffd700; font-size: 20px; margin: 8px 0; }

    /* PODIO DE DESTAQUES (TOP 3) */
    .podium { display: flex; justify-content: space-around; align-items: flex-end; margin-bottom: 20px; background: #252525; padding: 10px; border-radius: 8px; border: 1px solid #333; min-height: 120px; }
    .podium-spot { text-align: center; width: 30%; font-size: 12px; }
    .podium-crown { font-size: 22px; line-height: 1; margin-bottom: -2px; animation: float 2s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .podium-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-deck { color: #aaa; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-stars { color: #ffd700; font-weight: bold; font-size: 11px; }

    /* TABELA DE RANKING */
    .table-container { width: 100%; overflow-x: auto; background: #1e1e1e; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
    th { background: #252525; color: #ff8c00; font-weight: bold; }
    tr:hover { background: #252525; }
    .col-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }

    .status-msg { text-align: center; color: #ff5555; margin-top: 10px; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- TELA DE LOGIN -->
    <div id="loginSection">
      <h2>Entrar no Torneio</h2>
      <div class="form-group"><label>Nome do Duelista</label><input type="text" id="loginNome" placeholder="Seu nome"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="loginSenha" placeholder="Sua senha"></div>
      <button onclick="fazerLogin()">Duelar</button>
      <div class="toggle-link" onclick="alternarTelas(false)">Não tem cadastro? Registrar-se</div>
    </div>

    <!-- TELA DE CADASTRO -->
    <div id="cadastroSection" class="hidden">
      <h2>Novo Duelista</h2>
      <div class="form-group"><label>Nome do Duelista</label><input type="text" id="cadNome" placeholder="Ex: Yugi Muto"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="cadSenha" placeholder="Crie uma senha"></div>
      <div class="form-group"><label>Deck Principal</label><input type="text" id="cadDeck" placeholder="Ex: Blue-Eyes"></div>
      <button onclick="fazerCadastro()">Registrar e Iniciar</button>
      <div class="toggle-link" onclick="alternarTelas(true)">Já tem conta? Fazer Login</div>
    </div>

    <!-- APP PRINCIPAL (SÓ APARECE PÓS-LOGIN) -->
    <div id="appSection" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" id="btnTabPerfil" onclick="mudarAba('perfil')">Meu Perfil</button>
        <button class="tab-btn" id="btnTabRanking" onclick="mudarAba('ranking')">Ranking Geral</button>
      </div>

      <!-- ABA PERFIL / EDIÇÃO -->
      <div id="tabPerfil">
        <div class="profile-card">
          <h3 id="userNome" style="margin: 0; font-size: 22px; color: #ff8c00;"></h3>
          <p id="userDeck" style="color: #ccc; margin: 5px 0; font-size: 14px; font-weight: bold;"></p>
          <div class="stars" id="userEstrelas"></div>
        </div>
        <div style="background: #252525; padding: 12px; border-radius: 8px; border: 1px solid #333;">
          <h4 style="margin: 0 0 10px 0; color: #ff8c00; text-align: center;">Editar Dados</h4>
          <div class="form-group"><label>Alterar Nome</label><input type="text" id="editNome"></div>
          <div class="form-group"><label>Alterar Deck</label><input type="text" id="editDeck"></div>
          <div class="form-group"><label>Alterar Senha</label><input type="password" id="editSenha" placeholder="Nova senha"></div>
          <button onclick="salvarPerfil()">Atualizar Perfil</button>
        </div>
        <button style="background: #cc2222; margin-top: 15px;" onclick="fazerLogout()">Sair da Conta</button>
      </div>

      <!-- ABA RANKING GERAL -->
      <div id="tabRanking" class="hidden">
        <!-- PÓDIO TOP 3 -->
        <div class="podium">
          <div class="podium-spot" id="podium2" style="order: 1;"><div class="podium-crown">🥈</div><div class="podium-name">-</div><div class="podium-deck">-</div><div class="podium-stars">-</div></div>
          <div class="podium-spot" id="podium1" style="order: 2; margin-bottom: 10px;"><div class="podium-crown">👑</div><div class="podium-name" style="color:#ffd700;">-</div><div class="podium-deck">-</div><div class="podium-stars">-</div></div>
          <div class="podium-spot" id="podium3" style="order: 3;"><div class="podium-crown">🥉</div><div class="podium-name">-</div><div class="podium-deck">-</div><div class="podium-stars">-</div></div>
        </div>
        <!-- TABELA DE RANKING -->
        <div class="table-container">
          <table>
            <thead><tr><th>#</th><th>Nome</th><th>Deck</th><th>⭐</th><th>D</th><th>V</th><th>D</th><th>E</th><th>WR</th></tr></thead>
            <tbody id="rankingBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>
  <script>
    // IMPORTANTE: Insira aqui a URL gerada na Nova Implantação do seu Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbzuoapGqQebv9swdVCGkvu5KbLpDeEXh2S36jG8kAnQ81YSY0wjAk-HB9eR_c838qo/exec";

    window.onload = function() {
      verificarSessaoSalva();
    };

    function alternarTelas(mostrarLogin) {
      document.getElementById('loginSection').classList.toggle('hidden', !mostrarLogin);
      document.getElementById('cadastroSection').classList.toggle('hidden', mostrarLogin);
      exibirMensagem("");
    }

    function exibirMensagem(txt, erro = true) {
      const msg = document.getElementById('statusMsg');
      msg.innerText = txt;
      msg.style.color = erro ? "#ff5555" : "#55ff55";
    }

    async function consumirAPI(dados) {
      exibirMensagem("Acessando o servidor...");
      try {
        const resposta = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(dados)
        });
        return await resposta.json();
      } catch (err) {
        return { status: "erro", message: "Falha na conexão com o servidor." };
      }
    }

    async function fazerCadastro() {
      const nome = document.getElementById('cadNome').value.trim();
      const senha = document.getElementById('cadSenha').value.trim();
      const deck = document.getElementById('cadDeck').value.trim();

      if(!nome || !senha || !deck) return exibirMensagem("Preencha todos os campos!");

      const resultado = await consumirAPI({ action: "registrar", nome, senha, deck });
      
      if(resultado.status === "sucesso") {
        localStorage.setItem('ygo_token', resultado.token);
        exibirMensagem("Cadastro realizado com sucesso!", false);
        verificarSessaoSalva();
      } else {
        exibirMensagem(resultado.message);
      }
    }

    async function fazerLogin() {
      const nome = document.getElementById('loginNome').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();

      if(!nome || !senha) return exibirMensagem("Preencha usuário e senha!");

      const resultado = await consumirAPI({ action: "login", nome, senha });

      if(resultado.status === "sucesso") {
        localStorage.setItem('ygo_token', resultado.token);
        exibirMensagem("Login efetuado!", false);
        verificarSessaoSalva();
      } else {
        exibirMensagem(resultado.message);
      }
    }

        async function verificarSessaoSalva() {
      const tokenSalvo = localStorage.getItem('ygo_token');
      if(!tokenSalvo) return;

      const resultado = await consumirAPI({ action: "autologin", token: tokenSalvo });

      if(resultado.status === "sucesso") {
        // Força sumir as duas telas de autenticação imediatamente
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('cadastroSection').classList.add('hidden');
        
        // Exibe o painel principal do aplicativo
        document.getElementById('appSection').classList.remove('hidden');
        
        // Preenche as informações na tela
        document.getElementById('userNome').innerText = resultado.nome;
        document.getElementById('userDeck').innerText = "Deck: " + resultado.deck;
        document.getElementById('userEstrelas').innerText = "⭐ ".repeat(resultado.estrelas || 2);
        
        document.getElementById('editNome').value = resultado.nome;
        document.getElementById('editDeck').value = resultado.deck;
        document.getElementById('editSenha').value = "";
        
        exibirMensagem("");
      } else {
        localStorage.removeItem('ygo_token');
      }
    }

    async function salvarPerfil() {
      const tokenSalvo = localStorage.getItem('ygo_token');
      const novoNome = document.getElementById('editNome').value.trim();
      const novoDeck = document.getElementById('editDeck').value.trim();
      const novaSenha = document.getElementById('editSenha').value.trim();

      if(!novoNome || !novoDeck) return exibirMensagem("Nome e Deck não podem ficar vazios!");

      const dados = { action: "editarPerfil", token: tokenSalvo, novoNome, novoDeck };
      if(novaSenha) dados.novaSenha = novaSenha;

      const resultado = await consumirAPI(dados);

      if(resultado.status === "sucesso") {
        exibirMensagem(resultado.message, false);
        verificarSessaoSalva(); // Atualiza a tela com as novas informações
      } else {
        exibirMensagem(resultado.message);
      }
    }

    function mudarAba(aba) {
      document.getElementById('tabPerfil').classList.toggle('hidden', aba !== 'perfil');
      document.getElementById('tabRanking').classList.toggle('hidden', aba !== 'ranking');
      
      document.getElementById('btnTabPerfil').classList.toggle('active', aba === 'perfil');
      document.getElementById('btnTabRanking').classList.toggle('active', aba === 'ranking');
      
      exibirMensagem("");
      if(aba === 'ranking') {
        carregarRanking();
      }
    }

    async function carregarRanking() {
      const resultado = await consumirAPI({ action: "obterRanking" });

      if(resultado.status === "sucesso") {
        const ranking = resultado.ranking;
        exibirMensagem("", false);

        // 1. ATUALIZAR O PÓDIO (TOP 3)
        atualizarCardPodium("podium1", ranking[0], "👑 Rei dos Jogos");
        atualizarCardPodium("podium2", ranking[1], "🥈 2º Lugar");
        atualizarCardPodium("podium3", ranking[2], "🥉 3º Lugar");

        // 2. ATUALIZAR A TABELA DO RANKING GERAL
        const tbody = document.getElementById('rankingBody');
        tbody.innerHTML = "";

        ranking.forEach((player, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${index + 1}º</strong></td>
            <td class="col-name">${player.nome}</td>
            <td class="col-name" style="color: #aaa;">${player.deck}</td>
            <td style="color: #ffd700; font-weight: bold;">${player.estrelas}</td>
            <td>${player.duelos}</td>
            <td style="color: #55ff55;">${player.vitorias}</td>
            <td style="color: #ff5555;">${player.derrotas}</td>
            <td style="color: #ffff55;">${player.empates}</td>
            <td>${player.winrate}</td>
          `;
          tbody.appendChild(row);
        });
      } else {
        exibirMensagem(resultado.message);
      }
    }

    function atualizarCardPodium(idElemento, dadosJogador, coroaPadrao) {
      const card = document.getElementById(idElemento);
      if(dadosJogador) {
        card.querySelector('.podium-crown').innerText = idElemento === "podium1" ? "👑" : coroaPadrao.split(" ")[0];
        card.querySelector('.podium-name').innerText = dadosJogador.nome;
        card.querySelector('.podium-deck').innerText = dadosJogador.deck;
        card.querySelector('.podium-stars').innerText = "⭐ " + dadosJogador.estrelas;
      } else {
        card.querySelector('.podium-crown').innerText = "-";
        card.querySelector('.podium-name').innerText = "Vazio";
        card.querySelector('.podium-deck').innerText = "-";
        card.querySelector('.podium-stars').innerText = "-";
      }
    }

    function fazerLogout() {
      localStorage.removeItem('ygo_token');
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      exibirMensagem("Sessão encerrada.", false);
    }
  </script>
</body>
</html>
