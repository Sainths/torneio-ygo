<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>YGO Tournament Manager</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; box-sizing: border-box; }
    .container { width: 100%; max-width: 450px; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #2a2a2a; align-self: flex-start; }
    h2, h3, h4 { text-align: center; color: #ff8c00; margin-top: 0; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #b3b3b3; font-size: 13px; }
    input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 15px; }
    input:focus { border-color: #ff8c00; outline: none; }
    button { width: 100%; padding: 11px; background: #ff8c00; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:hover { background: #e07b00; }
    .toggle-link { text-align: center; margin-top: 12px; color: #ff8c00; cursor: pointer; font-size: 13px; }
    .hidden { display: none !important; }
    
    /* ABAS */
    .tabs { display: flex; margin-bottom: 15px; background: #252525; border-radius: 6px; padding: 3px; }
    .tab-btn { flex: 1; padding: 8px; text-align: center; background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 4px; }
    .tab-btn.active { background: #ff8c00; color: #fff; }

    /* PERFIL */
    .profile-card { text-align: center; background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
    .stars { color: #ffd700; font-size: 20px; margin: 8px 0; }

    /* PODIO TOP 3 */
    .podium { display: flex; justify-content: space-around; align-items: flex-end; margin-bottom: 20px; background: #252525; padding: 10px; border-radius: 8px; border: 1px solid #333; min-height: 120px; }
    .podium-spot { text-align: center; width: 30%; font-size: 12px; }
    .podium-crown { font-size: 22px; line-height: 1; margin-bottom: -2px; animation: float 2s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .podium-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-deck { color: #aaa; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-stars { color: #ffd700; font-weight: bold; font-size: 11px; }

    /* RANKING & TABELA */
    .table-container { width: 100%; overflow-x: auto; background: #1e1e1e; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #2a2a2a; white-space: nowrap; vertical-align: middle; }
    th { background: #252525; color: #ff8c00; font-weight: bold; }
    tr:hover { background: #252525; }
    .col-name { max-width: 75px; overflow: hidden; text-overflow: ellipsis; }
    .btn-duel { padding: 4px 8px; font-size: 11px; background: #ff8c00; border-radius: 4px; margin: 0; width: auto; display: inline-block; color: #fff; border: none; cursor: pointer; }

    /* POPUP DE CONVITE */
    .popup-box { background: #292929; border: 2px solid #ff8c00; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px; }
    .btn-accept { background: #22c55e; margin-right: 5px; width: 45%; display: inline-block; }
    .btn-deny { background: #ef4444; width: 45%; display: inline-block; }

    /* ARENA VERSUS */
    .versus-arena { text-align: center; padding: 20px; background: radial-gradient(circle, #2a1f10 0%, #1a1a1a 100%); border: 2px solid #ff8c00; border-radius: 12px; }
    .versus-title { font-size: 28px; font-weight: bold; color: #ff8c00; margin: 10px 0; text-shadow: 0 0 10px rgba(255,140,0,0.5); }
    .duel-btn-vitoria { background: #22c55e; margin-top: 15px; }
    .duel-btn-empate { background: #eab308; margin-top: 10px; }
    .duel-btn-derrota { background: #ef4444; margin-top: 10px; }

    .status-msg { text-align: center; color: #ff5555; margin-top: 10px; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- TELA DE LOGIN -->
    <div id="loginSection">
      <h2>Entrar no Torneio</h2>
      <div class="form-group"><label>Nome do Duelista</label><input type="text" id="loginNome" placeholder="Seu nome"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="loginSenha" placeholder="Sua senha"></div>
      <button onclick="fazerLogin()">Duelar</button>
      <div class="toggle-link" onclick="alternarTelas(false)">Não tem cadastro? Registrar-se</div>
    </div>

    <!-- TELA DE CADASTRO -->
    <div id="cadastroSection" class="hidden">
      <h2>Novo Duelista</h2>
      <div class="form-group"><label>Nome do Duelista</label><input type="text" id="cadNome" placeholder="Ex: Yugi Muto"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="cadSenha" placeholder="Crie uma senha"></div>
      <div class="form-group"><label>Deck Principal</label><input type="text" id="cadDeck" placeholder="Ex: Blue-Eyes"></div>
      <button onclick="fazerCadastro()">Registrar e Iniciar</button>
      <div class="toggle-link" onclick="alternarTelas(true)">Já tem conta? Fazer Login</div>
    </div>

    <!-- TELA POPUP DE CONVITE RECEBIDO -->
    <div id="convitePopup" class="popup-box hidden">
      <h3 style="margin-bottom: 5px;">⚠️ Desafio Recebido!</h3>
      <p id="conviteTexto" style="margin: 5px 0 5px 0; font-size: 15px;"></p>
      <p id="conviteAposta" style="margin: 0 0 15px 0; font-size: 14px; font-weight: bold; color: #ffd700;"></p>
      <button class="btn-accept" id="btnAceitar">Aceitar</button>
      <button class="btn-deny" id="btnRecusar">Recusar</button>
    </div>

    <!-- TELA DE DUELO ATIVO -->
    <div id="versusSection" class="versus-arena hidden">
      <div class="versus-title">💥 DUELO ATIVO 💥</div>
      <h3 id="versusJogadores" style="color: #fff; margin: 15px 0;">Você VS Oponente</h3>
      <p style="color: #aaa; font-size: 14px;">Selecione o seu resultado honesto:</p>
      <button class="duel-btn-vitoria" onclick="votarDuelo('Vitoria')">Ganhei</button>
      <button class="duel-btn-empate" onclick="votarDuelo('Empate')">Empate</button>
      <button class="duel-btn-derrota" onclick="votarDuelo('Derrota')">Perdi</button>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="appSection" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" id="btnTabPerfil" onclick="mudarAba('perfil')">Meu Perfil</button>
        <button class="tab-btn" id="btnTabRanking" onclick="mudarAba('ranking')">Ranking Geral</button>
      </div>

      <!-- ABA PERFIL -->
      <div id="tabPerfil">
        <div class="profile-card">
          <h3 id="userNome" style="margin: 0; font-size: 22px; color: #ff8c00;"></h3>
          <p id="userDeck" style="color: #ccc; margin: 5px 0; font-size: 14px; font-weight: bold;"></p>
          <div class="stars" id="userEstrelas"></div>
        </div>
        <div style="background: #252525; padding: 12px; border-radius: 8px; border: 1px solid #333;">
          <h4>Editar Dados</h4>
          <div class="form-group"><label>Alterar Nome</label><input type="text" id="editNome"></div>
          <div class="form-group"><label>Alterar Deck</label><input type="text" id="editDeck"></div>
          <div class="form-group"><label>Alterar Senha</label><input type="password" id="editSenha" placeholder="Nova senha"></div>
          <button onclick="salvarPerfil()">Atualizar Perfil</button>
        </div>
        <button style="background: #cc2222; margin-top: 15px;" onclick="fazerLogout()">Sair da Conta</button>
      </div>

      <!-- ABA RANKING -->
      <div id="tabRanking" class="hidden">
        <div class="podium">
          <div class="podium-spot" id="podium2" style="order: 1;"><div class="podium-crown">🥈</div><div class="podium-name">-</div><div class="podium-deck">-</div><div class="podium-stars">-</div></div>
          <div class="podium-spot" id="podium1" style="order: 2; margin-bottom: 10px;"><div class="podium-crown">👑</div><div class="podium-name" style="color:#ffd700;">-</div><div class="podium-deck">-</div><div class="podium-stars">-</div></div>
          <div class="podium-spot" id="podium3" style="order: 3;"><div class="podium-crown">🥉</div><div class="podium-name">-</div><div class="podium-deck">-</div><div class="podium-stars">-</div></div>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Deck</th>
                <th>⭐</th>
                <th>V/D/E</th>
                <th>Apostar ⭐</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="rankingBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>
  <script>
    // IMPORTANTE: Insira aqui a URL gerada na Nova Implantação do seu Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwYGWSfwkJ9H2zWgy0eSw3RDsi6CmR5Gds-ZvlaT3Arg_bsn6BytH-FBmDUddRJuY6s/exec";

    let MEU_NOME = "";
    let ID_DUELO_ATIVO = null;
    let LOOP_DESAFIOS = null;

    window.onload = function() {
      verificarSessaoSalva();
    };

    function alternarTelas(mostrarLogin) {
      document.getElementById('loginSection').classList.toggle('hidden', !mostrarLogin);
      document.getElementById('cadastroSection').classList.toggle('hidden', mostrarLogin);
      exibirMensagem("");
    }

    function exibirMensagem(txt, erro = true) {
      const msg = document.getElementById('statusMsg');
      if (msg) {
        msg.innerText = txt;
        msg.style.color = erro ? "#ff5555" : "#55ff55";
      }
    }

    async function consumirAPI(dados) {
      try {
        const resposta = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(dados)
        });
        return await resposta.json();
      } catch (err) {
        return { status: "erro", message: "Falha na conexão com o servidor." };
      }
    }

    async function fazerCadastro() {
      const nome = document.getElementById('cadNome').value.trim();
      const senha = document.getElementById('cadSenha').value.trim();
      const deck = document.getElementById('cadDeck').value.trim();
      if(!nome || !senha || !deck) return exibirMensagem("Preencha todos os campos!");
      exibirMensagem("Acessando o servidor...");
      const res = await consumirAPI({ action: "registrar", nome, senha, deck });
      if(res.status === "sucesso") {
        localStorage.setItem('ygo_token', res.token);
        exibirMensagem("Cadastro realizado!", false);
        verificarSessaoSalva();
      } else {
        exibirMensagem(res.message);
      }
    }

    async function fazerLogin() {
      const nome = document.getElementById('loginNome').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();
      if(!nome || !senha) return exibirMensagem("Preencha usuário e senha!");
      exibirMensagem("Acessando o servidor...");
      const res = await consumirAPI({ action: "login", nome, senha });
      if(res.status === "sucesso") {
        localStorage.setItem('ygo_token', res.token);
        exibirMensagem("Login efetuado!", false);
        verificarSessaoSalva();
      } else {
        exibirMensagem(res.message);
      }
    }
    
      async function verificarSessaoSalva() {
      const tokenSalvo = localStorage.getItem('ygo_token');
      if(!tokenSalvo) return;
      const res = await consumirAPI({ action: "autologin", token: tokenSalvo });
      if(res.status === "sucesso") {
        MEU_NOME = res.nome;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('cadastroSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        
        document.getElementById('userNome').innerText = res.nome;
        document.getElementById('userDeck').innerText = "Deck: " + res.deck;
        
        // APENAS ESTA LINHA FOI ALTERADA: Exibe a estrela uma vez seguida do multiplicador
        const qtdEstrelas = res.estrelas || 0;
        document.getElementById('userEstrelas').innerHTML = `⭐ <span style="font-size: 24px; font-weight: bold; vertical-align: middle;">x${qtdEstrelas}</span>`;
        
        document.getElementById('editNome').value = res.nome;
        document.getElementById('editDeck').value = res.deck;
        document.getElementById('editSenha').value = "";
        exibirMensagem("");

        if(!LOOP_DESAFIOS) {
          LOOP_DESAFIOS = setInterval(checarEventosTempoReal, 4000);
        }
      } else {
        localStorage.removeItem('ygo_token');
      }
    }

    async function salvarPerfil() {
      const tokenSalvo = localStorage.getItem('ygo_token');
      const novoNome = document.getElementById('editNome').value.trim();
      const novoDeck = document.getElementById('editDeck').value.trim();
      const novaSenha = document.getElementById('editSenha').value.trim();
      if(!novoNome || !novoDeck) return exibirMensagem("Campos vazios não permitidos!");
      exibirMensagem("Salvando dados...");
      const dados = { action: "editarPerfil", token: tokenSalvo, novoNome, novoDeck };
      if(novaSenha) dados.novaSenha = novaSenha;
      const res = await consumirAPI(dados);
      if(res.status === "sucesso") {
        exibirMensagem(res.message, false);
        verificarSessaoSalva();
      } else {
        exibirMensagem(res.message);
      }
    }

    function mudarAba(aba) {
      document.getElementById('tabPerfil').classList.toggle('hidden', aba !== 'perfil');
      document.getElementById('tabRanking').classList.toggle('hidden', aba !== 'ranking');
      document.getElementById('btnTabPerfil').classList.toggle('active', aba === 'perfil');
      document.getElementById('btnTabRanking').classList.toggle('active', aba === 'ranking');
      exibirMensagem("");
      if(aba === 'ranking') carregarRanking();
    }

           async function carregarRanking() {
      const res = await consumirAPI({ action: "obterRanking" });
      if(res.status === "sucesso") {
        const ranking = res.ranking;
        atualizarCardPodium("podium1", ranking, "👑 Rei dos Jogos");
        atualizarCardPodium("podium2", ranking, "🥈 2º Lugar");
        atualizarCardPodium("podium3", ranking, "🥉 3º Lugar");

        const tbody = document.getElementById('rankingBody');
        tbody.innerHTML = "";
        ranking.forEach((player, index) => {
          const row = document.createElement('tr');
          const eMeuPerfil = player.nome === MEU_NOME;
          
          const vitorias = player.vitorias !== undefined ? player.vitorias : 0;
          const derrotas = player.derrotas !== undefined ? player.derrotas : 0;
          const empates = player.empates !== undefined ? player.empates : 0;
          
          const totalDuelos = vitorias + derrotas + empates;
          
          const inputApostaHtml = eMeuPerfil ? `<span style="color:#666;">-</span>` : 
            `<input type="number" id="aposta_${player.nome}" value="0" min="0" aria-label="Aposta para ${player.nome}" style="width:50px; padding:4px; font-size:12px; text-align:center;">`;
          
          const btnHtml = eMeuPerfil ? `<span style="color:#666;">Você</span>` : 
            `<button class="btn-duel" onclick="prepararDesafio('${player.nome}')">Desafiar</button>`;

          // LINHA CORRIGIDA: Exibe o total de duelos de forma limpa como (3)
          row.innerHTML = `
            <td><strong>${index + 1}º</strong></td>
            <td class="col-name" style="${eMeuPerfil?'color:#ff8c00; font-weight:bold;':''}">${player.nome}</td>
            <td class="col-name" style="color: #aaa;">${player.deck || 'Nenhum'}</td>
            <td style="color: #ffd700; font-weight: bold;">${player.estrelas || 0}</td>
            <td><span style="color:#55ff55;">${vitorias}</span>/<span style="color:#ff5555;">${derrotas}</span>/<span style="color:#ffff55;">${empates}</span> <span style="color:#888; font-size:11px;">(${totalDuelos})</span></td>
            <td>${inputApostaHtml}</td>
            <td>${btnHtml}</td>
          `;
          tbody.appendChild(row);
        });
      }
    }

        function atualizarCardPodium(id, rankingLista, tituloPadrao) {
      const card = document.getElementById(id);
      if (!card) return;

      // Define qual índice da lista vai para qual lugar do pódio
      let index = 0;
      let emojiCoroa = "👑";
      if (id === "podium1") { index = 0; emojiCoroa = "👑"; }
      if (id === "podium2") { index = 1; emojiCoroa = "🥈"; }
      if (id === "podium3") { index = 2; emojiCoroa = "🥉"; }

      const player = rankingLista && rankingLista[index];

      if (player) {
        card.querySelector('.podium-crown').innerText = emojiCoroa;
        card.querySelector('.podium-name').innerText = player.nome || 'Vazio';
        card.querySelector('.podium-deck').innerText = player.deck || 'Nenhum';
        card.querySelector('.podium-stars').innerText = "⭐ " + (player.estrelas !== undefined ? player.estrelas : 0);
      } else {
        card.querySelector('.podium-crown').innerText = "-";
        card.querySelector('.podium-name').innerText = "Vazio";
        card.querySelector('.podium-deck').innerText = "-";
        card.querySelector('.podium-stars').innerText = "-";
      }
    }

    async function prepararDesafio(nomeOponente) {
      const input = document.getElementById(`aposta_${nomeOponente}`);
      const valorAposta = parseInt(input.value) || 0;
      if(valorAposta < 0) return exibirMensagem("A aposta não pode ser negativa!");
      
      let msgConfirmacao = valorAposta === 0 ? 
        `Deseja enviar um Duelo Tradicional para ${nomeOponente}?` : 
        `Deseja desafiar ${nomeOponente} apostando ${valorAposta} Estrela(s)?`;
        
      if(confirm(msgConfirmacao)) {
        exibirMensagem(`Enviando desafio para ${nomeOponente}...`);
        const res = await consumirAPI({ action: "enviarDesafio", desafiante: MEU_NOME, oponente: nomeOponente, aposta: valorAposta });
        if(res.status === "sucesso") {
          exibirMensagem("Desafio enviado! Aguardando oponente...", false);
        } else {
          exibirMensagem(res.message);
        }
      }
    }

    async function checarEventosTempoReal() {
      if(!MEU_NOME || ID_DUELO_ATIVO) return;
      const res = await consumirAPI({ action: "checarDesafios", meuNome: MEU_NOME });
      
      if(res.status === "convite") {
        ID_DUELO_ATIVO = res.dueloId;
        document.getElementById('conviteTexto').innerText = `${res.desafiante} está te desafiando!`;
        document.getElementById('conviteAposta').innerText = res.aposta > 0 ? 
          `⚔️ MODALIDADE: APOSTA VALENDO ${res.aposta} ESTRELAS!` : `📜 MODALIDADE: Duelo Tradicional`;
        
        document.getElementById('convitePopup').classList.remove('hidden');
        document.getElementById('btnAceitar').onclick = () => responderConvite("Aceito");
        document.getElementById('btnRecusar').onclick = () => responderConvite("Recusado");
      }
      if(res.status === "iniciarVersus") {
        ID_DUELO_ATIVO = res.dueloId;
        entrarNaArenaVersus(`Contra: ${res.oponente}`);
      }
      if(res.status === "recusado") {
        exibirMensagem(`O duelo foi recusado pelo oponente.`, true);
        ID_DUELO_ATIVO = null;
      }
    }

    async function responderConvite(resposta) {
      document.getElementById('convitePopup').classList.add('hidden');
      if(!ID_DUELO_ATIVO) return;
      const res = await consumirAPI({ action: "responderDesafio", dueloId: ID_DUELO_ATIVO, meuNome: MEU_NOME, resposta: resposta });
      if(res.status === "sucesso" && resposta === "Aceito") {
        entrarNaArenaVersus("Em Combate!");
      } else if(res.status === "erro") {
        exibirMensagem(res.message);
        ID_DUELO_ATIVO = null;
      } else {
        ID_DUELO_ATIVO = null;
      }
    }

    function entrarNaArenaVersus(textoLayout) {
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('versusSection').classList.remove('hidden');
      document.getElementById('versusJogadores').innerText = textoLayout;
      exibirMensagem("Arena Versus carregada. Reporte ao final!", false);
    }

    async function votarDuelo(meuVoto) {
      if(!ID_DUELO_ATIVO) return;
      exibirMensagem("Enviando voto...");
      const res = await consumirAPI({ action: "votarResultado", dueloId: ID_DUELO_ATIVO, meuNome: MEU_NOME, voto: meuVoto });
      if(res.status === "sucesso") {
        exibirMensagem("Voto registrado! Aguardando oponente...", false);
      } else if (res.status === "conflito") {
        exibirMensagem("🚨 Conflito de relatórios! Enviado para os ADMs.");
        finalizarArenaVersus();
      } else if (res.status === "finalizado") {
        exibirMensagem("🎉 Duelo concluído com consenso!", false);
        finalizarArenaVersus();
      }
    }

    function finalizarArenaVersus() {
      ID_DUELO_ATIVO = null;
      document.getElementById('versusSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      verificarSessaoSalva();
    }

    function fazerLogout() {
      localStorage.removeItem('ygo_token');
      if(LOOP_DESAFIOS) clearInterval(LOOP_DESAFIOS);
      MEU_NOME = "";
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('versusSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      exibirMensagem("Sessão encerrada.", false);
    }
  </script>
</body>
</html>
